<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Top Cake Illustration -->
    <div class="cake-illustration">
        <svg viewBox="0 0 100 100" class="cake-svg">
            <!-- Confetti -->
            <path d="M 15,25 Q 18,15 25,20" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 80,20 Q 85,28 75,32" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="20" cy="35" r="2" fill="#3b82f6"/>
            <circle cx="82" cy="15" r="2" fill="#eab308"/>
            <rect x="25" y="10" width="3" height="6" rx="1.5" fill="#22c55e" transform="rotate(25 25 10)"/>
            <rect x="70" y="25" width="3" height="6" rx="1.5" fill="#a855f7" transform="rotate(-20 70 25)"/>
            
            <!-- Candle & Flame -->
            <path d="M 50,15 Q 46,20 50,26 Q 54,20 50,15 Z" fill="#ff9800"/>
            <path d="M 50,19 Q 48,22 50,26 Q 52,22 50,19 Z" fill="#ffeb3b"/>
            <rect x="48.5" y="26" width="3" height="12" fill="#ff4081" rx="1"/>
            <line x1="48.5" y1="29" x2="51.5" y2="31" stroke="#ffffff" stroke-width="0.8"/>
            <line x1="48.5" y1="33" x2="51.5" y2="35" stroke="#ffffff" stroke-width="0.8"/>

            <!-- Cake Top Layer (Frosting) -->
            <ellipse cx="50" cy="38" rx="26" ry="7" fill="#ff80ab"/>
            <path d="M 24,38 Q 28,45 32,38 Q 36,45 40,38 Q 44,45 48,38 Q 52,45 56,38 Q 60,45 64,38 Q 68,45 72,38 Q 76,45 76,38 L 76,44 Q 50,56 24,44 Z" fill="#ff80ab"/>

            <!-- Cake Base Layer -->
            <path d="M 24,42 Q 50,54 76,42 L 76,68 Q 50,82 24,68 Z" fill="#f57c00"/>
            <path d="M 24,52 Q 50,64 76,52 L 76,57 Q 50,69 24,57 Z" fill="#795548"/>

            <!-- Cake Plate -->
            <ellipse cx="50" cy="70" rx="32" ry="7" fill="#29b6f6"/>
            <ellipse cx="50" cy="68" rx="30" ry="6" fill="#e0f7fa"/>
        </svg>
    </div>

    <h1>Birthday<br>Countdown</h1>

    <!-- Star Divider -->
    <div class="divider">
        <span class="line"></span>
        <span class="star">★</span>
        <span class="line"></span>
    </div>

    <p class="subtitle">
        Find out how many days are left<br>until your birthday!
    </p>

    <!-- Date Input -->
    <input type="date" id="bday" value="2025-06-15">

    <!-- Check Button -->
    <button id="checkBtn">
        <span class="btn-icon">🎁</span> Check
    </button>

    <!-- Countdown Numbers -->
    <div class="countdown">
        <div class="box">
            <span id="daysEl">21</span>
            <p>Days</p>
        </div>
        <div class="box">
            <span id="hoursEl">08</span>
            <p>Hours</p>
        </div>
        <div class="box">
            <span id="minutesEl">34</span>
            <p>Minutes</p>
        </div>
        <div class="box">
            <span id="secondsEl">19</span>
            <p>Seconds</p>
        </div>
    </div>

    <!-- Bottom Message -->
    <div class="message">
        <span class="popper-icon">🎉</span>
        <div class="message-text">
            Your special day<br>is coming soon! 💙
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
